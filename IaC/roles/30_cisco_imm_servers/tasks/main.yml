    name: 32_create_ucs_chassis_policies

- name: Create UCS FI Domain Policies in Intersight
  ansible.builtin.include_role:
    name: 33_create_ucs_domain_policies

- name: Create UCS Server Policies in Intersight
  ansible.builtin.include_role:
    name: 34_create_ucs_server_policies

- name: Create UCS vNIC Templates in Intersight
  ansible.builtin.include_tasks: 002_create_ucs_vnic_templates.yml

- name: Create UCS LAN Connectivity Policies in Intersight
  ansible.builtin.include_tasks: 003_create_ucs_lan_connectivity_policies.yml

# -------------------------------------------------------------------------------
