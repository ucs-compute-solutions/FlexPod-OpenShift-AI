- name: Create iSCSI Target Policy for boot from SAN
  ansible.builtin.include_tasks: 023_create_iscsi_target_policy.yml
  when: configure_iscsi_boot == 'true'

- name: Create FC LAN Connectivity Policy if FC
  ansible.builtin.include_tasks: 024_create_fc_lan_connectivity_policy.yml
  when: (configure_fc == 'true') and (fc_lan_connectivity_policy.api_response.Moid is not defined)

- name: Create iSCSI LAN Connectivity Policy if iSCSI
