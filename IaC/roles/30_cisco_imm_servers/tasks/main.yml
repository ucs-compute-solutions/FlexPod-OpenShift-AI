    name: 31_create_ucs_server_pools

# -------------------------------------------------------------------------------
#       CREATE UCS IMM POLICIES FOR DOMAIN, CHASSIS and SERVER TEMPLATES
# -------------------------------------------------------------------------------

- name: Create UCS Chassis Policies in Intersight
