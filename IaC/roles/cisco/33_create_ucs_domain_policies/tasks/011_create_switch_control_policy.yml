---
- name: Create Switch Control Policy
  vars:
    api_info: &api_info
      api_private_key: "{{ intersight_api_private_key }}"
      api_key_id: "{{ intersight_api_key_id }}"
      api_uri: "{{ api_uri | default(omit) }}"
      validate_certs: "{{ validate_certs | default(omit) }}"
      state: "{{ state | default(omit) }}"
  
  block:
    - name: Configure Switch Control Policy
      cisco.intersight.intersight_rest_api:
        <<: *api_info
        resource_path: /fabric/SwitchControlPolicies
        query_params:
          $filter: "Name eq '{{ name_of_switch_control_policy }}'"
        api_body: {
              "Name": "{{ name_of_switch_control_policy }}",
              "Description": "{{ description_of_switch_control_policy }}",
              "Organization": { "Moid": "{{ intersight_org.api_response.Moid }}" },
              "EthernetSwitchingMode":"end-host",
              "FcSwitchingMode":"end-host",
              "VlanPortOptimizationEnabled":false,
              "ReservedVlanStartId":3915,
              "MacAgingSettings":{"MacAgingOption":"Default"},
              "UdldSettings":{"MessageInterval":15,"RecoveryAction":"none"},
              "FabricPcVhbaReset":"Disabled",
              Tags: [{Key: "Provisioned by:", Value: "Intersight-Ansible"},{Key: "Project:", Value: "{{ prefix }}"}]
          }
        state: present
      register: switch_control_policy
    