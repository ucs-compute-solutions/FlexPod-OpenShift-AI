---
- name: Create VLAN Multicast Policy
  vars:
    api_info: &api_info
      api_private_key: "{{ intersight_api_private_key }}"
      api_key_id: "{{ intersight_api_key_id }}"
      api_uri: "{{ api_uri | default(omit) }}"
      validate_certs: "{{ validate_certs | default(omit) }}"
      state: "{{ state | default(omit) }}"
  
  block:
    - name: Configure VLAN Multicast Policy
      cisco.intersight.intersight_rest_api:
        <<: *api_info
        resource_path: /fabric/MulticastPolicies
        query_params:
          $filter: "Name eq '{{ name_of_vlan_multicast_policy }}'"
        api_body: {
              "Name": "{{ name_of_vlan_multicast_policy }}",
              "Description": "{{ description_of_vlan_multicast_policy }}",
              "Organization": { "Moid": "{{ intersight_org.api_response.Moid }}",
              "QuerierState": "Disabled",
              "SnoopingState": "Enabled",
              "SrcIpProxy": "Enabled"
              },
              Tags: [{Key: "Provisioned by:", Value: "Intersight-Ansible"},{Key: "Project:", Value: "{{ prefix }}"}]
          }
        state: present
      register: vlan_multicast_policy
      