---
- name: Create Ethernet Adapter Policies for Linux and VMware 
  vars:
    api_info: &api_info
      api_private_key: "{{ intersight_api_private_key }}"
      api_key_id: "{{ intersight_api_key_id }}"
      api_uri: "{{ api_uri | default(omit) }}"
      validate_certs: "{{ validate_certs | default(omit) }}"
      state: "{{ state | default(omit) }}"

  block: 
  # LINUX
    - name: "Configure Linux Default Ethernet Adapter Policy"
      cisco.intersight.intersight_rest_api:
        <<: *api_info
        resource_path: /vnic/EthAdapterPolicies
        query_params:
          $filter: "Name eq '{{ name_of_linux_default_ethernet_adapter_policy }}'"
        api_body: {
              "Name": "{{ name_of_linux_default_ethernet_adapter_policy }}",
              "Description": "{{ description_of_linux_default_ethernet_adapter_policy }}",
              "Organization": {
                "Moid": "{{ intersight_org.api_response.Moid }}"
              },
              Tags: [{Key: "Provisioned by:", Value: "Intersight-Ansible"},{Key: "Project:", Value: "{{ prefix }}"}],
              
              "AdvancedFilter": false,
              "ArfsSettings": {
                  "Enabled": false
              },
              "CompletionQueueSettings": {
                "Count": "{{ linux_default_completion_queue_count }}",
                "RingSize": "{{ linux_default_completion_queue_ringsize }}"
              },
              "GeneveEnabled": false,
              "InterruptScaling": false,
              "InterruptSettings": {
                "Count": "{{ linux_default_interrupt_settings_count }}",
                "Mode": "MSIx",
                "CoalescingTime": 125,
                "CoalescingType": "MIN"
              },
              "NvgreSettings": {
                "Enabled": false
              },
              PtpSettings: {
                Enabled: false
              },
              "RoceSettings": {
                "Enabled": false
              },
              "RssHashSettings": {
                Ipv4Hash: true, 
                Ipv6ExtHash: false, 
                Ipv6Hash: true, 
                TcpIpv4Hash: true, 
                TcpIpv6ExtHash: false,
                TcpIpv6Hash: true,
                UdpIpv4Hash: false,
                UdpIpv6Hash: false
              },
              "RssSettings": true,
              "RxQueueSettings": {
                "Count": "{{ linux_default_rx_queue_settings_count }}",
                "RingSize": "{{ linux_default_rx_queue_settings_ringsize }}"
              },
              "TcpOffloadSettings": {
                "TxChecksum": true,
                "RxChecksum": true,
                "LargeSend": true,
                "LargeReceive": true
              },
              "TxQueueSettings": {
                "Count": "{{ linux_default_tx_queue_settings_count }}",
                "RingSize": "{{ linux_default_tx_queue_settings_ringsize }}"
              },
              "UplinkFailbackTimeout": 5,
              "VxlanSettings": {
                "Enabled": false
              }
          }
      register: linux_default_ethernet_adapter_policy
      when: os_type == "linux"

