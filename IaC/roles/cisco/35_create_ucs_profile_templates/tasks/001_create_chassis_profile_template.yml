---
- name: Create Chassis Profile Template 
  vars:
    api_info: &api_info
      api_private_key: "{{ intersight_api_private_key }}"
      api_key_id: "{{ intersight_api_key_id }}"
      api_uri: "{{ api_uri | default(omit) }}"
      validate_certs: "{{ validate_certs | default(omit) }}"
      state: "{{ state | default(omit) }}"
  
  block:
  - name: Configure Chassis Profile Template 
    cisco.intersight.intersight_rest_api:
      <<: *api_info
      resource_path: /chassis/ProfileTemplates
      # update_method: POST
      query_params:
        $filter: "Name eq '{{ name_of_chassis_profile_template }}'"
      api_body: {
            "Name": "{{ name_of_chassis_profile_template }}",
            "Description": "{{ description_of_chassis_profile_template }}",
            "Organization": {"Moid": "{{ intersight_org.api_response.Moid }}"},
            ClassId: "chassis.ProfileTemplate",
            "PolicyBucket": [
              {
                "Moid": "{{ imc_access_policy.api_response.Moid }}",
                "ObjectType": "access.Policy"
              },
              {
                "Moid": "{{ power_policy.api_response.Moid }}",
                "ObjectType": "power.Policy"
              },
              {
                "Moid": "{{ snmp_policy.api_response.Moid }}",
                "ObjectType": "snmp.Policy"
              },
              {
                "Moid": "{{ thermal_policy.api_response.Moid }}",
                "ObjectType": "thermal.Policy"
              }
            ],
            "TargetPlatform": "FIAttached",
            Tags: [{Key: "Provisioned by:", Value: "Intersight-Ansible"},{Key: "Project:", Value: "{{ prefix }}"}]
        }
      state: present
    register: chassis_profile_template
    