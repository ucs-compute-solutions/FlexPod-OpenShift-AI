---

# ----------------------------------------------------------------------------------------------
#   Deploy UCS Server Profiles. Profiles are derived from a Server Profile Template, 
#   then assigned (future) and deployed (future) on UCS servers. 
# ----------------------------------------------------------------------------------------------

- name: Define anchor for Intersight API login info
  ansible.builtin.set_fact:
    api_info: &api_info
      api_private_key: "{{ intersight_api_private_key }}"
      api_key_id: "{{ intersight_api_key_id }}"
      api_uri: "{{ api_uri | default(omit) }}"
      validate_certs: "{{ validate_certs | default(omit) }}"
      state: "{{ state | default(omit) }}"


- name: "Derive Service Profiles from {{ local_ocp_control_server_profile_template }}"
  intersight_rest_api:
    <<: *api_info
    resource_path: /bulk/MoCloners
    update_method: post
    api_body: {
      "Sources": [
        {
          # "ClassId": "mo.MoRef",
          "ObjectType": "server.ProfileTemplate",
          "Moid": "{{ local_ocp_control_server_profile_template.api_response.Moid }}"
        }
      ],
      "Targets": [
        {
          # "Name": "{{ template_name }}_DERIVED-{{ item }}",
          "Name": "{{name_of_local_ocp_c_server_profile}}-{{item}}",
          "ObjectType": "server.Profile",
          "Organization": {
            "Moid": "{{ intersight_org.api_response.Moid }}"
          },
          # "ClassId": "server.Profile"
        }
      ]
    }
  # when: profile_resp.api_response is not defined or not profile_resp.api_response
  loop: "{{ range(1, number_of_local_ocp_c_server_profiles | int + 1) | list }}"

- name: "Derive Service Profiles from {{ local_ocp_worker_server_profile_template }}"
  intersight_rest_api:
    <<: *api_info
    resource_path: /bulk/MoCloners
    update_method: post
    api_body: {
      "Sources": [
        {
          # "ClassId": "mo.MoRef",
          "ObjectType": "server.ProfileTemplate",
          "Moid": "{{ local_ocp_worker_server_profile_template.api_response.Moid }}"
        }
      ],
      "Targets": [
        {
          "Name": "{{name_of_local_ocp_w_server_profile}}-{{item}}",
          "ObjectType": "server.Profile",
          "Organization": {
            "Moid": "{{ intersight_org.api_response.Moid }}"
        },
          # "ClassId": "server.Profile"
        }
      ]
    }
  # when: profile_resp.api_response is not defined or not profile_resp.api_response
  loop: "{{ range(1, number_of_local_ocp_w_server_profiles | int + 1) | list }}"

