---

# -------------------------------------------------------------------------------------
#  
#  
# -------------------------------------------------------------------------------------

- name: Define anchor for Intersight API login info
  ansible.builtin.set_fact:
      api_info: &api_info
        api_private_key: "{{ intersight_api_private_key }}"
        api_key_id: "{{ intersight_api_key_id }}"
        api_uri: "{{ api_uri | default(omit) }}"
        validate_certs: "{{ validate_certs | default(omit) }}"
        state: "{{ state | default(omit) }}"

- name: Create LAN Connectivity Policy for OpenShift Control Nodes with Local Boot
  # Storage vNICs are not provisioned for Openshift control nodes 
  block:
    - name: "Configure LAN Connectivity Policy for OpenShift Control Nodes"
      cisco.intersight.intersight_rest_api:
        <<: *api_info
        resource_path: /vnic/LanConnectivityPolicies
        query_params:
          $filter: "Name eq '{{ name_of_ocp_control_lan_connectivity_policy }}'"
        api_body: {
            "Name": "{{ name_of_ocp_control_lan_connectivity_policy }}",
            "Description": "{{ description_of_ocp_control_lan_connectivity_policy }}",
            "Organization": {
              "Moid": "{{ intersight_org.api_response.Moid }}"
            },
            Tags: [{Key: "Provisioned by:", Value: "Intersight-Ansible"},{Key: "Project:", Value: "{{ prefix }}"}], 

            "TargetPlatform": "FIAttached",
            "AzureQosEnabled": false,
            "IqnAllocationType": "None",
            "IqnPool": "",
            "PlacementMode": "custom",
            "StaticIqnName": "",
        }
        state: present
      register: ocp_control_lan_connectivity_policy
      when: configure_openshift == 'true'

    - name: Debug ocp_control_vnic_templates results
      debug:
        var: ocp_control_vnic_templates.results
      when: configure_openshift == 'true'

    - name: Add vNICs to LAN Connectivity Policy for OCP Control Nodes
      cisco.intersight.intersight_rest_api:
        <<: *api_info
        resource_path: /bulk/MoCloners
        query_params:
          # $filter: "Name eq '{{ name_of_control_cluster_mgmt_a_vnic }}'"
          $filter: "Name eq 'eno{{5 + item.item.value.pci_order | int}}-{{item.item.key}}_vnic'"
        api_body: {
          "Organization": {
            "Moid": "{{ intersight_org.api_response.Moid }}"
          },
          "Sources": [
            {
              "Moid": "{{ item.api_response.Moid }}",
              "ObjectType": "vnic.VnicTemplate"
            }
          ],
          "Targets": [
            {
              "LanConnectivityPolicy": "{{ocp_control_lan_connectivity_policy.api_response.Moid}}",
              "MacAddressType": "POOL",
              "Name": "eno{{5 + item.item.value.pci_order | int}}-{{item.item.key}}_vnic",
              "ObjectType": "vnic.EthIf",
              "Order": "{{ item.item.value.pci_order }}",
              "Placement": {
                  "AutoPciLink": true,
                  "AutoSlotId": true
              }
            }
          ],
          "WorkflowNameSuffix": "Add vNIC from a Template"            
        }
        state: present  
      register: ocp_control_lan_connectivity_policy_vnics
      loop: "{{ ocp_control_vnic_templates.results }}"
      when: configure_openshift == 'true'
  

- name: Create LAN Connectivity Policy for OpenShift Worker Nodes using Local Boot  
  block:
    - name: "Configure LAN Connectivity Policy for OpenShift Worker Nodes"
      cisco.intersight.intersight_rest_api:
        <<: *api_info
        resource_path: /vnic/LanConnectivityPolicies
        query_params:
          $filter: "Name eq '{{ name_of_ocp_worker_lan_connectivity_policy }}'"
        api_body: {
            "Name": "{{ name_of_ocp_worker_lan_connectivity_policy }}",
            "Description": "{{ description_of_ocp_worker_lan_connectivity_policy }}",
            "Organization": {
              "Moid": "{{ intersight_org.api_response.Moid }}"
            },
            Tags: [{Key: "Provisioned by:", Value: "Intersight-Ansible"},{Key: "Project:", Value: "{{ prefix }}"}], 

            "TargetPlatform": "FIAttached",
            "AzureQosEnabled": false,
            "IqnAllocationType": "None",
            "IqnPool": "",
            "PlacementMode": "custom",
            "StaticIqnName": "",
        }
        state: present
      register: ocp_worker_lan_connectivity_policy
      when: configure_openshift == 'true'

    - name: Debug ocp_worker_vnic_templates results
      debug:
        var: ocp_worker_vnic_templates.results
      when: configure_openshift == 'true'

    - name: Add vNICs to LAN Connectivity Policy for OCP Worker Nodes
      cisco.intersight.intersight_rest_api:
        <<: *api_info
        resource_path: /bulk/MoCloners
        query_params:
          $filter: "Name eq 'eno{{5 + item.item.value.pci_order | int}}-{{item.item.key}}_vnic'"
        api_body: {
          "Organization": {
            "Moid": "{{ intersight_org.api_response.Moid }}"
          },
          "Sources": [
            {
              "Moid": "{{ item.api_response.Moid }}",
              "ObjectType": "vnic.VnicTemplate"
            }
          ],
          "Targets": [
            {
              "LanConnectivityPolicy": "{{ocp_worker_lan_connectivity_policy.api_response.Moid}}",
              "MacAddressType": "POOL",
              "Name": "eno{{5 + item.item.value.pci_order | int}}-{{item.item.key}}_vnic",
              "ObjectType": "vnic.EthIf",
              "Order": "{{ item.item.value.pci_order }}",
              "Placement": {
                  "AutoPciLink": true,
                  "AutoSlotId": true
              }
            }
          ],
          "WorkflowNameSuffix": "Add vNIC from a Template"            
        }
        state: present  
      register: ocp_worker_lan_connectivity_policy_vnics
      loop: "{{ ocp_worker_vnic_templates.results }}"
      when: configure_openshift == 'true'

  delegate_to: localhost
  run_once: true


