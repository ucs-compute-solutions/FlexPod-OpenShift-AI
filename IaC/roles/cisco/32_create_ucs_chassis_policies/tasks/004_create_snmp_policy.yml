---
- name: Create SNMP Policy
  vars:
    api_info: &api_info
      api_private_key: "{{ intersight_api_private_key }}"
      api_key_id: "{{ intersight_api_key_id }}"
      api_uri: "{{ api_uri | default(omit) }}"
      validate_certs: "{{ validate_certs | default(omit) }}"
      state: "{{ state | default(omit) }}"

  block: 
    - name: Configure SNMP Policy
      cisco.intersight.intersight_rest_api:
        <<: *api_info
        resource_path: /snmp/Policies
        query_params:
            $filter: "Name eq '{{ name_of_snmp_policy }}'"
        api_body: {
          "Name": "{{ name_of_snmp_policy }}",
          "Description": "{{ description_of_snmp_policy }}",
          "Organization": {
              "Moid": "{{ intersight_org.api_response.Moid }}"
          },
          Tags: [{Key: "configmode", Value: "ansible"},{Key: "prefix", Value: "{{ prefix }}"}],
          "CommunityAccess": "Disabled",
          "Enabled": true,
          "SnmpPort": 161,
          "SnmpTraps": [],
          "SnmpUsers": [
            {
              "AuthPassword": "{{ snmp_auth_password }}",
              "AuthType": "SHA",
              "Name": "{{ snmp_user_name }}",
              "PrivacyPassword": "{{ snmp_priv_password }}",
              "PrivacyType": "AES",
              "SecurityLevel": "AuthPriv"
            }
          ],
          "SysContact": "{{ snmp_contact }}",
          "SysLocation": "{{ snmp_location }}",
          "V2Enabled": false,
          "V3Enabled": true
        }
        state: present
      register: snmp_policy
