---
- name: Create Virtual Media Policy
  vars:
    api_info: &api_info
      api_private_key: "{{ intersight_api_private_key }}"
      api_key_id: "{{ intersight_api_key_id }}"
      api_uri: "{{ api_uri | default(omit) }}"
      validate_certs: "{{ validate_certs | default(omit) }}"
      state: "{{ state | default(omit) }}"
    
  block:
    - name: Configure Virtual Media Policy
      cisco.intersight.intersight_virtual_media_policy:
        <<: *api_info
        name: "{{ vmedia_policy_vars.name }}"
        description: "{{ vmedia_policy_vars.description }}"
        organization: "{{ org_name }}"
        enable: true
        encryption: true
        low_power_usb: true
        tags: [{Key: "Provisioned by:", Value: "Intersight-Ansible"},{Key: "Project:", Value: "{{ prefix }}"}]
        cdd_virtual_media:
          enable: true
          mount_type: "{{ vmedia_policy_vars.mount_type }}"
          volume: "{{ vmedia_policy_vars.volume }}"
          remote_hostname: "{{ vmedia_policy_vars.remote_hostname }}"
          remote_path: "{{ vmedia_policy_vars.remote_path }}"
          remote_file: "{{ vmedia_policy_vars.remote_file }}"
          username: "{{ vmedia_policy_vars.username }}"
          password: "{{ vmedia_policy_vars.password }}"
          mount_options: "{{ vmedia_policy_vars.mount_options | default(omit) }}"
        state: present
      register: vmedia_policy


