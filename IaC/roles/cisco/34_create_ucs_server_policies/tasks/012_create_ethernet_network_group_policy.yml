---
- name: Create Ethernet Network Group Policies for In-Band andCluster Management, NFS/Object, iSCSI/NVMe and VM Networks
  vars:
    api_info: &api_info
      api_private_key: "{{ intersight_api_private_key }}"
      api_key_id: "{{ intersight_api_key_id }}"
      api_uri: "{{ api_uri | default(omit) }}"
      validate_certs: "{{ validate_certs | default(omit) }}"
      state: "{{ state | default(omit) }}"

  block:
    - name: Print out type for VLANs
      debug:
        msg: 
          - "AllowedVlans: {{ allowed_vlans_for_ib_mgmt_vnic }} (type: {{ allowed_vlans_for_ib_mgmt_vnic | type_debug }})"
          - "NativeVlan: {{ native_vlan_for_ib_mgmt_vnic }} (type: {{ native_vlan_for_ib_mgmt_vnic | type_debug }})"
        
    - name: Configure Ethernet Network Group Policy for Red Hat OpenShift Cluster In-Band Management vNIC
      cisco.intersight.intersight_rest_api:
        <<: *api_info
        resource_path: /fabric/EthNetworkGroupPolicies
        query_params:
          $filter: "Name eq '{{ name_of_ib_mgmt_eng_policy }}'"
        api_body: {
          "Name": "{{ name_of_ib_mgmt_eng_policy }}",
          "Description": "{{ description_of_ib_mgmt_eng_policy }}",
          "Organization": { "Moid": "{{ intersight_org.api_response.Moid }}"},
          "VlanSettings": {
              "NativeVlan": "{{ native_vlan_for_ib_mgmt_vnic }}",
              "AllowedVlans": "{{ allowed_vlans_for_ib_mgmt_vnic | string }}"
            },
          "Tags": [{Key: "Provisioned by:", Value: "Intersight-Ansible"},{Key: "Project:", Value: "{{ prefix }}"}]
          }
        state: present
      register: ib_mgmt_eng_policy

    - name: Configure Ethernet Network Group Policy for Red Hat OpenShift Cluster Management vNIC
      cisco.intersight.intersight_rest_api:
        <<: *api_info
        resource_path: /fabric/EthNetworkGroupPolicies
        query_params:
          $filter: "Name eq '{{ name_of_cluster_mgmt_eng_policy }}'"
        api_body: {
          "Name": "{{ name_of_cluster_mgmt_eng_policy }}",
          "Description": "{{ description_of_cluster_mgmt_eng_policy }}",
          "Organization": { "Moid": "{{ intersight_org.api_response.Moid }}"},
          "VlanSettings": {
              "AllowedVlans": "{{ allowed_vlans_for_cluster_mgmt_vnic | string }}",
              "NativeVlan": "{{ native_vlan_for_cluster_mgmt_vnic }}"
            },
          "Tags": [{Key: "Provisioned by:", Value: "Intersight-Ansible"},{Key: "Project:", Value: "{{ prefix }}"}]
          }
        state: present
      register: cluster_mgmt_eng_policy


    - name: Create Ethernet Network Group Policy for iSCSI-A/NVMe-A vNIC
      cisco.intersight.intersight_rest_api:
        <<: *api_info
        resource_path: /fabric/EthNetworkGroupPolicies
        # update_method: post
        query_params:
          $filter: "Name eq '{{ name_of_iscsi_a_eng_policy }}'"
        api_body: {
          "Name": "{{ name_of_iscsi_a_eng_policy }}",
          "Description": "{{ description_of_iscsi_a_eng_policy }}",
          "Organization": { "Moid": "{{ intersight_org.api_response.Moid }}" },
          "VlanSettings": {
              "AllowedVlans": "{{ allowed_vlans_for_iscsi_a_vnic | string  }}",
              "NativeVlan": "{{ native_vlan_for_iscsi_a_vnic }}"
          },
          "Tags": [{Key: "Provisioned by:", Value: "Intersight-Ansible"},{Key: "Project:", Value: "{{ prefix }}"}]
        }
        state: present
      register: iscsi_a_eng_policy


    - name: Create Ethernet Network Group Policy for iSCSI-B/NVMe-B vNIC
      cisco.intersight.intersight_rest_api:
        <<: *api_info
        resource_path: /fabric/EthNetworkGroupPolicies
        update_method: post
        query_params:
          $filter: "Name eq '{{ name_of_iscsi_b_eng_policy }}'"
        api_body: {
          "Name": "{{ name_of_iscsi_b_eng_policy }}",
          "Description": "{{ description_of_iscsi_b_eng_policy }}",
          "Organization": { "Moid": "{{ intersight_org.api_response.Moid }}" },
          "VlanSettings": {
              "AllowedVlans": "{{ allowed_vlans_for_iscsi_b_vnic | string }}",
              "NativeVlan": "{{ native_vlan_for_iscsi_b_vnic }}"
          },
          "Tags": [{Key: "Provisioned by:", Value: "Intersight-Ansible"},{Key: "Project:", Value: "{{ prefix }}"}]
        }
        state: present
      register: iscsi_b_eng_policy


    - name: Create Ethernet Network Group Policy for NFS vNIC
      cisco.intersight.intersight_rest_api:
        <<: *api_info
        resource_path: /fabric/EthNetworkGroupPolicies
        query_params:
          $filter: "Name eq '{{ name_of_nfs_storage_eng_policy }}'"
        api_body: {
          "Name": "{{ name_of_nfs_storage_eng_policy }}",
          "Description": "{{ description_of_nfs_storage_eng_policy }}",
          "Organization": { "Moid": "{{ intersight_org.api_response.Moid }}" },
          "VlanSettings": {
              "AllowedVlans": "{{ allowed_vlans_for_nfs_storage_vnic | string }}",
              "NativeVlan": "{{ native_vlan_for_nfs_storage_vnic }}"
          },
          "Tags": [{Key: "Provisioned by:", Value: "Intersight-Ansible"},{Key: "Project:", Value: "{{ prefix }}"}]
        }
        state: present
      register: nfs_storage_eng_policy

    - name: Create Ethernet Network Group Policy for S3-OBJ vNIC
      cisco.intersight.intersight_rest_api:
        <<: *api_info
        resource_path: /fabric/EthNetworkGroupPolicies
        query_params:
          $filter: "Name eq '{{ name_of_s3_obj_storage_eng_policy }}'"
        api_body: {
          "Name": "{{ name_of_s3_obj_storage_eng_policy }}",
          "Description": "{{ description_of_s3_obj_storage_eng_policy }}",
          "Organization": { "Moid": "{{ intersight_org.api_response.Moid }}" },
          "VlanSettings": {
              "AllowedVlans": "{{ allowed_vlans_for_s3_obj_storage_vnic | string }}",
              "NativeVlan": "{{ native_vlan_for_s3_obj_storage_vnic }}"
          },
          "Tags": [{Key: "Provisioned by:", Value: "Intersight-Ansible"},{Key: "Project:", Value: "{{ prefix }}"}]
        }
        state: present
      register: s3_obj_storage_eng_policy