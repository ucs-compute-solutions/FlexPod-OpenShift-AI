---
- name: Create FI VLAN Policy
  vars:
    api_info: &api_info
      api_private_key: "{{ intersight_api_private_key }}"
      api_key_id: "{{ intersight_api_key_id }}"
      api_uri: "{{ api_uri | default(omit) }}"
      validate_certs: "{{ validate_certs | default(omit) }}"
      state: "{{ state | default(omit) }}"
  
  block:
    - name: Configure FI VLAN  Policy
      cisco.intersight.intersight_rest_api:
        <<: *api_info
        resource_path: /fabric/EthNetworkPolicies
        query_params:
          $filter: "Name eq '{{ name_of_fi_vlan_policy }}'"
        api_body: {
              "Name": "{{ name_of_fi_vlan_policy }}",
              "Description": "{{ description_of_fi_vlan_policy }}",
              "Organization": { "Moid": "{{ intersight_org.api_response.Moid }}" },
              Tags: [{Key: "Provisioned by:", Value: "Intersight-Ansible"},{Key: "Project:", Value: "{{ prefix }}"}]
          }
        state: present
      register: fi_vlan_policy

    - name: Add VLANs to FI
      cisco.intersight.intersight_rest_api:
        <<: *api_info
        resource_path: /bulk/Requests 
        # query_params:
        #   $filter: "Name eq '{{ item.name }}_{{item.id}}'"
        api_body: {
          "Requests": [
            {
              "Body": {
                "AutoAllowOnUplinks": true,
                "EthNetworkPolicy": "{{ fi_vlan_policy.api_response.Moid }}",
                "IsNative": "{{ item.native_vlan | bool }}",
                "MulticastPolicy": "{{ vlan_multicast_policy.api_response.Moid }}",
                "Name": "{{ item.name }}_{{ item.id }}",
                "PrimaryVlanId": 0,
                "SharingType": "None",
                "VlanId": "{{ item.id | int }}"
              },
            "ObjectType": "bulk.RestSubRequest"
            }
          ],
          "Uri": "/v1/fabric/Vlans",
          "Verb": "POST"
        }
        state: present
      loop: "{{ fi_vlan_list }}"
      register: fi_vlan_list


   